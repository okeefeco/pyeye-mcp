# CI Workflow
#
# PR matrix strategy (Issue #65): on PRs, test every supported Python (3.11,
# 3.12, 3.13, 3.14) on Linux, the oldest and newest (3.11, 3.14) on Windows,
# and only the newest on macOS. Pushes to main run the full 3-OS x 4-version
# matrix. macOS combinations are dropped on PRs first because macOS bills at
# 10x (see the multiplier table below).
#
# Python 3.14 (#543) was added as extra legs, not by renaming the 3.13 legs,
# so the required check names below stay valid. The 3.13 Windows/macOS legs
# remain until the `main` ruleset's required checks move to 3.14 (a repo
# setting); the 3.14 legs are not required checks until then.
#
# Merge queue (#649): a `merge_group` run must report EVERY required check
# exactly once, or the queue waits forever. The required names are pre-commit,
# type-check, changelog-validation, changes, security and the 6 `test-pr (os,
# py)` names (the PR matrix). On merge_group there is no docs-only shortcut:
# `changes` forces code=true, so the real test-pr and type-check jobs run and
# their docs-only dummies skip. test-main stays push-only (its ref check never
# matches a gh-readonly-queue/* ref).
#
# Platform minute multipliers (GitHub-hosted runners):
# - Linux:   1x (1 minute = 1 minute billed)
# - Windows: 2x (1 minute = 2 minutes billed)
# - macOS:  10x (1 minute = 10 minutes billed)

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # pip-audit audits this interpreter's env, so use the newest supported
          # Python (#522). Lint/type targets come from pyproject (ruff/black/mypy).
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --locked  # creates .venv so the repo:local hooks' `uv run <tool>` resolves
      - uses: pre-commit/action@v3.0.1
      - name: Docs facts are current (#824)
        # pre-commit's generate hook only runs on matching files; check always
        # compares every fact block, reference page and the snapshot.
        run: uv run --frozen python scripts/docs_facts.py check

  # Detect if only documentation files changed
  changes:
    runs-on: ubuntu-latest
    # Each output takes the paths filter's value on pull_request and the forced
    # value otherwise. (The outputs used to read only the filter step, so on
    # push the "always run code checks" step never reached them; consumers only
    # worked because they also tested event_name.)
    outputs:
      docs: ${{ steps.filter.outputs.docs || steps.non-pr.outputs.docs }}
      code: ${{ steps.filter.outputs.code || steps.non-pr.outputs.code }}
      plugins: ${{ steps.filter.outputs.plugins || steps.non-pr.outputs.plugins }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            docs:
              - '**.md'
              - 'docs/**'
              - '.github/*.md'
              - 'LICENSE'
            code:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'uv.toml'
              - 'requirements*.txt'
              - '.github/workflows/**'
              - 'setup.py'
              - 'setup.cfg'
            plugins:
              - 'plugins/**'
              - '.github/workflows/**'
      # For non-PR events (push, merge_group, workflow_dispatch), always run
      # code checks: a merge_group run must exercise the full matrix.
      - name: Set outputs for non-PR events
        if: github.event_name != 'pull_request'
        id: non-pr
        run: |
          echo "code=true" >> $GITHUB_OUTPUT
          echo "docs=false" >> $GITHUB_OUTPUT
          echo "plugins=true" >> $GITHUB_OUTPUT

  test-pr:
    # Runs on PRs and merge-queue groups - reduced endpoint matrix (see header).
    # Its 6 non-3.14 job names are required checks. Skipped only for docs-only PRs, when
    # test-pr-dummy reports the same names instead; merge_group always has
    # code == 'true'.
    needs: [changes]
    if: |
      (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
      needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15  # Prevent runaway tests
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux - every supported version (cheapest runner)
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: ubuntu-latest
            python-version: '3.14'
          # Windows - oldest and newest (3.13 kept while it is a required check)
          - os: windows-latest
            python-version: '3.11'
          - os: windows-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.14'
          # macOS - newest only (biggest savings; 3.13 kept while required).
          # 3.14 also exercises watchdog, which has no macOS cp314 wheel.
          - os: macos-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.14'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests with coverage
        # #775: the merge queue runs the exhaustive path variants too, so it
        # tests exactly what push-to-main tests (the gap that let main go red).
        # Off on Windows, where symlinks need privileges, as on test-main.
        env:
          PYEYE_EXHAUSTIVE_PATHS: ${{ github.event_name == 'merge_group' && matrix.os != 'windows-latest' && '1' || '' }}
        run: uv run pytest --cov=src/pyeye --cov-report=xml --cov-report=term --cov-fail-under=85

      - name: Upload coverage to Codecov
        # Skip for Dependabot PRs as they don't have access to secrets
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  test-main:
    # Runs on main branch - full matrix for comprehensive testing
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15  # Prevent runaway tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests with coverage
        # The exhaustive path-variant runs (#717): every corpus under every
        # root spelling. Per-PR runs cover the corpora that catch #714-class
        # bugs. Off on Windows, where symlinks need privileges.
        env:
          PYEYE_EXHAUSTIVE_PATHS: ${{ matrix.os != 'windows-latest' && '1' || '' }}
        run: uv run pytest --cov=src/pyeye --cov-report=xml --cov-report=term --cov-fail-under=85

      - name: Upload coverage to Codecov
        # Skip for Dependabot PRs as they don't have access to secrets
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  plugin-tests:
    # Standalone worktree-hook plugin suite, fully decoupled from the pyeye
    # package and its coverage gate (--no-cov). Runs only when the plugin (or
    # the CI workflow) changes — see the 'plugins' path filter above.
    needs: [changes]
    if: |
      github.event_name != 'pull_request' ||
      needs.changes.outputs.plugins == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'

      - name: Install dependencies
        run: uv sync --locked

      - name: Run worktree-hook plugin tests
        run: uv run pytest plugins/worktree-hook/tests --no-cov

  type-check:
    # Skip type checking for documentation-only changes in PRs
    runs-on: ubuntu-latest
    needs: [changes]
    if: |
      github.event_name != 'pull_request' ||
      needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'

      - name: Install dependencies
        run: uv sync --locked  # setuptools_scm is in the dev group

      - name: Generate version file
        run: |
          # Generate _version.py using setuptools_scm
          cat > generate_version.py << 'EOF'
          from setuptools_scm import get_version
          import pathlib
          import re

          version = get_version()

          # Parse version to match setuptools_scm native format
          # Release versions (e.g., '0.3.0'): 3-tuple
          # Dev versions (e.g., '0.3.1.dev1+gc7c622c'): 5-tuple
          parts = re.match(r'(\d+)\.(\d+)\.(\d+)(\.(.+))?', version)
          if parts:
              major, minor, patch = int(parts[1]), int(parts[2]), int(parts[3])
              rest = parts[5] if parts[5] else ''
              if rest:
                  # Dev/pre-release version - use 5-tuple format
                  if '+' in rest:
                      pre, local = rest.split('+', 1)
                      version_tuple = (major, minor, patch, pre, local)
                  else:
                      version_tuple = (major, minor, patch, rest, '')
              else:
                  # Clean release - use 3-tuple format
                  version_tuple = (major, minor, patch)
          else:
              # Fallback - use 3-tuple
              version_tuple = (0, 0, 0)

          # Generate the _version.py file
          version_file = pathlib.Path('src/pyeye/_version.py')
          version_file.write_text(f'''"""Auto-generated version file."""
          __version__ = "{version}"
          __version_tuple__ = {version_tuple}
          ''')
          print(f'Generated _version.py with version {version}')
          EOF
          uv run python generate_version.py

      - name: Run mypy
        run: uv run mypy src/pyeye --ignore-missing-imports

  changelog-validation:
    # Validate CHANGELOG.md structure and that every v* tag has a section (#583)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tags are needed for the tag-consistency checks

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Validate changelog
        run: |
          python scripts/changelog.py check

      - name: Validate decision log
        # One file per decision (#679): front matter, names, symmetric
        # amend/supersede links, and no entries left in DECISIONS.md. Stdlib only.
        run: |
          python scripts/decisions.py check

  security:
    # Always run security checks, even for docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'

      - name: Install dependencies
        run: uv sync --locked

      - name: Run bandit
        run: uv run bandit -r src/ -ll

  docs-feedback:
    # Comment on genuinely documentation-only PRs. Reuses the SAME `changes`
    # classifier as the test gate (needs.changes.outputs.code), so the comment
    # can never contradict what CI actually did — this is the single source of
    # truth for "docs vs code" (see #500). Idempotent: posts at most once.
    needs: [changes]
    if: |
      github.event_name == 'pull_request' &&
      needs.changes.outputs.code != 'true' &&
      needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post documentation-only PR comment
        uses: actions/github-script@v9
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const already = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Documentation-only change detected')
            );
            if (already) return;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '📚 **Documentation-only change detected**',
                '',
                'No source, test, or workflow files changed in this PR, so the',
                'test matrix, type-checking, and coverage jobs were skipped.',
                '',
                'Pre-commit hooks, security scanning, and file validation still ran.',
              ].join('\n'),
            });

  # Dummy success jobs for docs-only PRs to satisfy branch protection
  # These jobs report success when tests are skipped for documentation changes.
  # Never on merge_group: there code == 'true', so the real jobs report these
  # names and a dummy would report them a second time.
  test-pr-dummy:
    name: test-pr (${{ matrix.os }}, ${{ matrix.python-version }})
    needs: [changes]
    if: |
      github.event_name == 'pull_request' &&
      needs.changes.outputs.code != 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: ubuntu-latest
            python-version: '3.14'
          - os: windows-latest
            python-version: '3.11'
          - os: windows-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.14'
          - os: macos-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.14'
    steps:
      - name: Skip tests for docs-only changes
        run: echo "Skipping tests - documentation only changes detected"

  type-check-dummy:
    name: type-check
    needs: [changes]
    if: |
      github.event_name == 'pull_request' &&
      needs.changes.outputs.code != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Skip type checking for docs-only changes
        run: echo "Skipping type checking - documentation only changes detected"
