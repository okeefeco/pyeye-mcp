# Publish the docs site to GitHub Pages (#861).
#
# Runs only on a push to main (and by hand), never on pull requests or the
# merge queue: those build the site strictly in ci.yml's pre-commit job. The
# pages and the nav come from the doc registry (scripts/mkdocs_hooks.py).
# Deployed through GitHub Actions: Settings -> Pages -> Source is
# "GitHub Actions".
name: Docs site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install the docs group
        run: uv sync --locked --group docs
      - name: Build the site
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: uv run --frozen --group docs mkdocs build --strict
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
