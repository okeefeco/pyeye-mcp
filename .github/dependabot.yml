# Dependabot configuration for automated dependency updates
# Documentation: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Python dependencies via uv: updates pyproject.toml AND uv.lock together.
  # The "pip" ecosystem left uv.lock stale, so every PR failed CI's
  # `uv sync --locked` before anything ran (#532).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      # Weekly updates to balance security and PR noise
      interval: "weekly"
      day: "monday"
      time: "04:00"
    # Allow up to 10 open pull requests for Python dependencies
    open-pull-requests-limit: 10
    # Group dependency updates when possible. The uv ecosystem does not
    # support `dependency-type` in groups, so membership is by name pattern
    # only and a dependency joins the FIRST group it matches.
    groups:
      # Dev/docs tooling (the `dev` and `docs` dependency-groups), all update types
      dev-dependencies:
        patterns:
          - "pytest*"
          - "mypy*"
          - "types-*"
          - "black"
          - "ruff"
          - "pre-commit"
          - "bandit"
          - "detect-secrets"
          - "pip-audit"
          - "commitizen"
          - "coverage*"
          - "pydocstyle"
          - "sphinx*"
          - "myst-parser"
      # Everything else: minor and patch updates together; majors stay individual
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Labels to apply to PRs
    labels:
      - "dependencies"
    # Commit message prefix
    commit-message:
      prefix: "chore"
      include: "scope"
    # PR title prefix
    pull-request-branch-name:
      separator: "-"

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    # Allow up to 5 open pull requests for GitHub Actions
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci/cd"
    commit-message:
      prefix: "ci"
      include: "scope"
