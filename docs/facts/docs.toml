# pyeye's doc registry (#1107): every documentation file and how the checks treat it.
#
# Each [[doc]] is one file (or, for changes/*.md, a one-level glob): path,
# audience ("human", "claude" or "both"), kind ("prose", "reference", "skill",
# "history" or "record"), and optionally site, covers and allow. allow maps a
# prose-rule ID to the findings the page may still have; it only shrinks.
# See docs/development/docs-facts.md.

# Repository root

[[doc]]
path = "README.md"
audience = "human"
kind = "prose"

[doc.allow]
"removed-name" = [
    "names removed tool 'find_references' beside 'removed'",
    "names removed tool 'get_call_hierarchy' beside 'removed'",
    "names removed tool 'analyze_dependencies' beside 'removed'",
]

[[doc]]
path = "CONTRIBUTING.md"
audience = "human"
kind = "prose"

[[doc]]
path = "DOCUMENTATION.md"
audience = "human"
kind = "prose"

[[doc]]
path = "SECURITY.md"
audience = "human"
kind = "prose"

[[doc]]
path = "CLAUDE.md"
audience = "claude"
kind = "prose"

[[doc]]
path = "CHANGELOG.md"
audience = "human"
kind = "history"

# Contributor plumbing stays off the site (C16).

[[doc]]
path = "changes/README.md"
audience = "human"
kind = "prose"
site = false

[[doc]]
path = "changes/*.md"
audience = "human"
kind = "history"
site = false

